models_hyperparameters: 
  LinearRegression: 
    fit_intercept: [True, False]
  
  DecisionTree: 
    max_depth: [3, 5, 10, None]
    min_samples_split: [2, 5, 10]
  
  RandomForest: 
    n_estimators: [50, 100, 200]
    max_depth: [5, 10, None]
    min_samples_split: [2, 5, 10]

GridSearchCV: 
  cv: 5
  scoring: 'neg_mean_squared_error'
  n_jobs: # how many cores are thrown into the system