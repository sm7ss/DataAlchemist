scaler_rules: 
  robust_scaler_percent: 0.05
  standard_scaler_percent: 0.01
  # The difference between robust and standard will be MinMaxScaler

best_model_rules: 
  cv_fold: 5
  train_test_difference_percent: 0.10
  unstable_cross_validation_percent: 0.05

models_hyperparameters: 
  linear_regression: 
    enable: True
    fit_intercept: [True, False]
  
  decision_tree: 
    enable: True
    max_depth: [3, 5, 10]
    min_samples_split: [2, 5, 10]
  
  random_forest: 
    enable: True
    n_estimators: [50, 100, 200]
    max_depth: [5, 10]
    min_samples_split: [2, 5, 10]

grid_search_cv: 
  cv: 5
  scoring: 
    neg_mean_absolute_error: 'neg_mean_absolute_error'
    neg_mean_squared_error: 'neg_mean_squared_error' 
    neg_root_mean_squared_error: 'neg_root_mean_squared_error'
    r2: 'r2'
  n_jobs: 2 # how many cores are thrown into the system