path: 
  data: 'users_behavior.csv' # crime.parquet
  overhead_percent: 1.8
  sample_data_percent: 0.1 #percent data analysis, this can change by system to be optimal, not used now, until laz and streaming is added

eda: 
  general_information: True
  null_values: True
  null_values_percent_column: 0.65
  null_values_percent_row: 0.40
  basic_analysis_data: 
    distribution: 
      columns: 
      enable: True
    outliers: 
      columns:
      enable: True
      method: #if a method is not given, the value will be 'iqr'
    correlation: 
      columns: 
      enable: True
    category_dominance: 
      columns: 
      enable: True
      top_n: #if a top_n is not given, the value will be 2
      rare_threshold_percent: #if a threshold is not given, the value will be 0.01

ml_preprocessing: 
  auto_preprocessing: True
  
  columns: # if None, all columns will be used
  
  sampling: # if not value given 'random' will be used
  representative_column: #use when "representative" is selected
  
  null_num_handler: # if not value given 'median' will be used
  null_cat_handler: # if not value given 'constantValue' will be used
  null_cat_handler_value: # if not value is given "Unknown" will be used
  
  distribution: 
    transformer: 
  
  outlier: 
    strategy: # if not given "iqr" will be the strategy used
    filter: 
    impute_outliers: 
    flag: # Bool True/False
    transform: 
  
  correlation:
    high_correlation: # if None, then join will be the operation
    remove_column: # just if high_correlation is selected if not, join will be the auto operation for not deleting any column
  
  category: # THIS IS MISSING
    operation: # if not value given, "Group" operation will be given
    name_operation_value: # Value for operation, if None, then "Unknown" will be the auto value given

ml_training: # Encoder & Scaler not working
  target: 'is_ultra'
  
  train_temp: 0.3
  test_val: 0.5
  random_state: 42
  
  encoder: # 🚨 NOT AVAILABLE 🚨 Can be auto, if auto, every column will have their encoder, if not all colulmns will have the encoder you selected 
  scaler: # 🚨 NOT AVAILABLE 🚨 if none, auto will be use, the algorithm will decide




