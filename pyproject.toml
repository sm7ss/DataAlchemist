[project]
name = "peligrosa"
version = "0.1.0"
description = "🐥 Plataforma low-code/terminal para ML"
authors = [
    {name = "🐥"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "altair (==6.0.0)",
    "annotated-types (==0.7.0)",
    "attrs (==26.1.0)",
    "blinker (==1.9.0)",
    "cachetools (==7.0.5)",
    "certifi (==2026.2.25)",
    "charset-normalizer (==3.4.6)",
    "click (==8.3.1)",
    "gitdb (==4.0.12)",
    "gitpython (==3.1.46)",
    "idna (==3.11)",
    "jinja2 (==3.1.6)",
    "jsonschema (==4.26.0)",
    "jsonschema-specifications (==2025.9.1)",
    "markupsafe (==3.0.3)",
    "narwhals (==2.18.1)",
    "numpy (==2.2.6)",
    "orjson (==3.11.7)",
    "packaging (==26.0)",
    "pandas (==2.3.3)",
    "pillow (==12.1.1)",
    "plotly (==6.6.0)",
    "polars (==1.39.3)",
    "polars-runtime-32 (==1.39.3)",
    "protobuf (==6.33.6)",
    "pyarrow (==23.0.1)",
    "pydantic (==2.12.5)",
    "pydantic-core (==2.41.5)",
    "pydeck (==0.9.1)",
    "python-dateutil (==2.9.0.post0)",
    "pytz (==2026.1.post1)",
    "pyyaml (==6.0.3)",
    "referencing (==0.37.0)",
    "requests (==2.33.1)",
    "rpds-py (==0.30.0)",
    "six (==1.17.0)",
    "smmap (==5.0.3)",
    "streamlit (==1.55.0)",
    "tenacity (==9.1.4)",
    "toml (==0.10.2)",
    "tomli (==2.4.1)",
    "tornado (==6.5.5)",
    "typing-inspection (==0.4.2)",
    "typing-extensions (==4.15.0)",
    "tzdata (==2025.3)",
    "urllib3 (==2.6.3)",
    "watchdog (==6.0.0)",
    "scikit-learn (>=1.6.0,<1.7.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "imbalanced-learn (>=0.14.1,<0.15.0)",
    "nbformat (>=4.2.0)",
    "hydra-core (>=1.3.4,<2.0.0)",
    "omegaconf (>=2.3.1,<3.0.0)",
    "xgboost (<3.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
